services:
  api:
    build: .
    ports:
      - '8080:8080'
    depends_on:
      - postgres
      - mailpit
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tienda
      - SPRING_MAIL_HOST=mailpit
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=tienda'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=tienda'
    ports:
      - '5432:5432'
  mailpit:
    image: 'axllent/mailpit'
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 5000
